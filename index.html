<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Withings callback</title>
<style>
  body{font:16px -apple-system,system-ui,sans-serif;max-width:560px;margin:15vh auto;padding:0 16px;text-align:center}
  code{display:block;font-size:20px;padding:12px;background:#f2f2f2;border-radius:8px;word-break:break-all;margin:16px 0}
  button{font-size:18px;padding:10px 24px;border-radius:8px;border:0;background:#111;color:#fff;cursor:pointer}
</style>
<h2 id="h">Withings authorization</h2>
<code id="c">—</code>
<button id="b">Copy code</button>
<p id="m">Paste it into the terminal within 30 seconds.</p>
<script>
  const p = new URLSearchParams(location.search), code = p.get('code');
  if (code) {
    document.getElementById('c').textContent = code;
    navigator.clipboard?.writeText(code).then(() => document.getElementById('m').textContent = 'Copied to clipboard. Paste it into the terminal now.');
  } else {
    document.getElementById('h').textContent = 'No code in URL';
    document.getElementById('m').textContent = p.get('error') || 'This page only shows a code after Withings redirects here.';
  }
  document.getElementById('b').onclick = () => navigator.clipboard.writeText(code || '');
</script>
